<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Clone UI</title>

<style>
:root {
    --bg: #ffffff;
    --text: #000000;
    --border: #e5e5e5;
    --user: #000000;
    --userText: #ffffff;
    --assistant: #ffffff;
    --box: #f7f7f7;
}

/* DARK MODE */
body.dark {
    --bg: #0d0d0d;
    --text: #ffffff;
    --border: #2a2a2a;
    --box: #151515;
    --assistant: #151515;
    --user: #ffffff;
    --userText: #000000;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    border-right: 1px solid var(--border);
    padding: 14px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-weight: 700;
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid var(--border);
}

.btn {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid var(--text);
    background: transparent;
    cursor: pointer;
    color: var(--text);
}

.btn:hover {
    background: var(--text);
    color: var(--bg);
}

.history {
    margin-top: 12px;
    overflow-y: auto;
    font-size: 12px;
}

.history-item {
    padding: 8px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    cursor: pointer;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
}

/* CHAT AREA */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* MESSAGE */
.msg {
    max-width: 70%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    align-self: flex-end;
    background: var(--user);
    color: var(--userText);
    border: none;
}

.assistant {
    align-self: flex-start;
    background: var(--assistant);
}

/* INPUT BAR */
.input-bar {
    display: flex;
    padding: 12px;
    border-top: 1px solid var(--border);
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    outline: none;
    background: transparent;
    color: var(--text);
}

button.send {
    padding: 12px 16px;
    border: none;
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
}

button.send:hover {
    opacity: 0.85;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">CHATGPT UI</div>

    <button class="btn" onclick="toggleTheme()">Toggle Theme</button>
    <button class="btn" onclick="newChat()">New Chat</button>

    <div class="history" id="history"></div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="header">
        <div>Chat Assistant</div>
        <div id="status">Ready</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-bar">
        <input id="input" placeholder="Message..." />
        <button class="send" onclick="send()">Send</button>
    </div>

</div>

<script>

/* MEMORY SYSTEM */
let chats = JSON.parse(localStorage.getItem("chatgpt_chats") || "[]");
let current = [];

function save() {
    localStorage.setItem("chatgpt_chats", JSON.stringify(chats));
}

/* RENDER HISTORY */
function renderHistory() {
    const h = document.getElementById("history");
    h.innerHTML = chats.map((c, i) => `
        <div class="history-item" onclick="loadChat(${i})">
            ${c[0]?.text?.substring(0, 20) || "Chat"}...
        </div>
    `).join("");
}

function loadChat(i) {
    current = chats[i];
    renderChat();
}

/* NEW CHAT */
function newChat() {
    current = [];
    renderChat();
}

/* ADD MESSAGE */
function add(role, text) {
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerText = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    current.push({ role, text });
}

/* RENDER CHAT */
function renderChat() {
    const chat = document.getElementById("chat");
    chat.innerHTML = "";

    current.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg " + m.role;
        div.innerText = m.text;
        chat.appendChild(div);
    });

    chat.scrollTop = chat.scrollHeight;
}

/* SEND MESSAGE */
async function send() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;

    add("user", text);
    input.value = "";

    document.getElementById("status").innerText = "Thinking...";

    // MOCK RESPONSE (replace with backend later)
    setTimeout(() => {
        add("assistant", "This is a mock response. Connect backend API for real AI.");
        document.getElementById("status").innerText = "Ready";

        chats.unshift(current);
        save();
        renderHistory();
    }, 700);
}

/* THEME */
function toggleTheme() {
    document.body.classList.toggle("dark");
}

/* INIT */
renderHistory();

</script>

</body>
</html>
