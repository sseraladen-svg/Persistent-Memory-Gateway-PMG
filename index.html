<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI Assistant</title>
<style>
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-tertiary: #1a1a25;
    --accent-primary: #6366f1;
    --accent-secondary: #8b5cf6;
    --accent-tertiary: #a855f7;
    --text-primary: #ffffff;
    --text-secondary: #a1a1aa;
    --border-color: #2a2a3a;
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 20px;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.nav-btn {
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    text-align: left;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}

.nav-btn:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
}

.nav-btn.active {
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: white;
}

/* Main Content */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 20px 30px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-title {
    font-size: 20px;
    font-weight: 600;
}

.model-selector {
    display: flex;
    gap: 12px;
    align-items: center;
}

select {
    padding: 8px 16px;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 8px;
    outline: none;
    cursor: pointer;
    transition: all 0.3s;
}

select:hover {
    border-color: var(--accent-primary);
}

.status-badge {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
}

.status-badge.online {
    background: rgba(16, 185, 129, 0.2);
    color: var(--success);
}

/* Chat Area */
.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.message {
    max-width: 70%;
    padding: 16px 20px;
    border-radius: 16px;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: white;
    border-bottom-right-radius: 4px;
}

.message.assistant {
    align-self: flex-start;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-bottom-left-radius: 4px;
}

/* Input Area */
.input-area {
    padding: 20px 30px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
}

.input-container {
    display: flex;
    gap: 12px;
    align-items: flex-end;
}

.input-wrapper {
    flex: 1;
    position: relative;
}

textarea {
    width: 100%;
    padding: 16px 20px;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 12px;
    outline: none;
    resize: none;
    font-size: 14px;
    line-height: 1.5;
    transition: all 0.3s;
    min-height: 50px;
    max-height: 150px;
}

textarea:focus {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
}

.icon-btn {
    width: 50px;
    height: 50px;
    border: none;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-size: 20px;
}

.icon-btn:hover {
    background: var(--border-color);
    color: var(--text-primary);
}

.icon-btn.send {
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: white;
}

.icon-btn.send:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}

.icon-btn.recording {
    background: var(--error);
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Settings Modal */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.modal-header {
    padding: 24px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 20px;
    font-weight: 600;
}

.close-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 24px;
    cursor: pointer;
    transition: color 0.3s;
}

.close-btn:hover {
    color: var(--text-primary);
}

.modal-body {
    padding: 24px;
}

.setting-group {
    margin-bottom: 24px;
}

.setting-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-secondary);
}

.setting-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 8px;
    outline: none;
    transition: all 0.3s;
}

.setting-input:focus {
    border-color: var(--accent-primary);
}

.setting-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    color: white;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}

/* Empty State */
.empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    text-align: center;
}

.empty-state-icon {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.5;
}

.empty-state-text {
    font-size: 18px;
    margin-bottom: 8px;
}

.empty-state-subtext {
    font-size: 14px;
    opacity: 0.7;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--text-secondary);
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="logo">
        <div class="logo-icon">🤖</div>
        JARVIS
    </div>
    
    <button class="nav-btn active" onclick="showChat()">
        <span>💬</span> Chat
    </button>
    <button class="nav-btn" onclick="showMemory()">
        <span>🧠</span> Memory
    </button>
    <button class="nav-btn" onclick="showSettings()">
        <span>⚙️</span> Settings
    </button>
    <button class="nav-btn" onclick="newChat()">
        <span>➕</span> New Chat
    </button>
</div>

<!-- Main Content -->
<div class="main">
    <!-- Header -->
    <div class="header">
        <div class="header-title">JARVIS AI Assistant</div>
        <div class="model-selector">
            <select id="providerSelect" onchange="switchProvider()">
                <option value="ollama">Ollama</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
                <option value="huggingface">HuggingFace</option>
                <option value="custom">Custom</option>
            </select>
            <select id="modelSelect" onchange="switchModel()">
                <option value="">Loading models...</option>
            </select>
            <div id="status" class="status-badge">Connecting...</div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="empty-state">
            <div class="empty-state-icon">🚀</div>
            <div class="empty-state-text">Welcome to JARVIS</div>
            <div class="empty-state-subtext">Select a model and start chatting</div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Type your message or use voice input..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
            </div>
            <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice Input">🎤</button>
            <button class="icon-btn send" onclick="sendMessage()" title="Send">➤</button>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Settings</div>
            <button class="close-btn" onclick="closeSettings()">×</button>
        </div>
        <div class="modal-body">
            <div class="setting-group">
                <label class="setting-label">API Keys</label>
                <div class="setting-row">
                    <input type="password" class="setting-input" id="openaiKey" placeholder="OpenAI API Key">
                    <input type="password" class="setting-input" id="anthropicKey" placeholder="Anthropic API Key">
                </div>
                <div class="setting-row" style="margin-top: 12px;">
                    <input type="password" class="setting-input" id="huggingfaceKey" placeholder="HuggingFace API Key">
                    <input type="password" class="setting-input" id="customKey" placeholder="Custom API Key">
                </div>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">Custom Model Configuration</label>
                <input type="text" class="setting-input" id="customEndpoint" placeholder="Custom API Endpoint URL" style="margin-bottom: 12px;">
                <input type="text" class="setting-input" id="customModel" placeholder="Custom Model Name">
            </div>
            
            <div class="setting-group">
                <label class="setting-label">Generation Parameters</label>
                <div class="setting-row">
                    <input type="number" class="setting-input" id="temperature" placeholder="Temperature (0.0-1.0)" step="0.1" min="0" max="1">
                    <input type="number" class="setting-input" id="maxTokens" placeholder="Max Tokens" min="1">
                </div>
            </div>
            
            <button class="save-btn" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>
</div>

<script>
let currentProvider = "ollama";
let currentModel = "";
let sessionId = generateSessionId();
let isRecording = false;
let recognition = null;

function generateSessionId() {
    return 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadProviders();
    checkHealth();
    loadSettings();
    setInterval(checkHealth, 30000);
    
    // Auto-resize textarea
    const textarea = document.getElementById('messageInput');
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });
});

// Health Check
async function checkHealth() {
    try {
        const response = await fetch('/api/health');
        const data = await response.json();
        const statusDiv = document.getElementById("status");
        
        if (data.provider_status === "ok") {
            statusDiv.className = "status-badge online";
            statusDiv.textContent = `${data.provider}/${data.model}`;
        } else {
            statusDiv.className = "status-badge";
            statusDiv.textContent = "Provider Error";
        }
    } catch (error) {
        document.getElementById("status").className = "status-badge";
        document.getElementById("status").textContent = "Offline";
    }
}

// Load Providers
async function loadProviders() {
    try {
        const response = await fetch('/api/providers');
        const data = await response.json();
        
        const providerSelect = document.getElementById("providerSelect");
        const modelSelect = document.getElementById("modelSelect");
        
        currentProvider = data.current_provider;
        currentModel = data.current_model;
        providerSelect.value = currentProvider;
        
        if (data.providers[currentProvider] && data.providers[currentProvider].models) {
            modelSelect.innerHTML = data.providers[currentProvider].models
                .map(model => `<option value="${model}" ${model === currentModel ? 'selected' : ''}>${model}</option>`)
                .join('');
        }
        
        Object.keys(data.providers).forEach(provider => {
            const option = providerSelect.querySelector(`option[value="${provider}"]`);
            if (option) {
                option.disabled = !data.providers[provider].enabled;
            }
        });
    } catch (error) {
        console.error("Error loading providers:", error);
    }
}

// Switch Provider
async function switchProvider() {
    const providerSelect = document.getElementById("providerSelect");
    const modelSelect = document.getElementById("modelSelect");
    const newProvider = providerSelect.value;
    
    currentProvider = newProvider;
    
    try {
        const response = await fetch('/api/providers');
        const data = await response.json();
        
        if (data.providers[newProvider] && data.providers[newProvider].models) {
            modelSelect.innerHTML = data.providers[newProvider].models
                .map(model => `<option value="${model}">${model}</option>`)
                .join('');
            currentModel = data.providers[newProvider].models[0];
            modelSelect.value = currentModel;
        }
        
        await fetch('/api/switch_provider', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ provider: newProvider, model: currentModel })
        });
        
        checkHealth();
    } catch (error) {
        console.error("Error switching provider:", error);
    }
}

// Switch Model
async function switchModel() {
    const modelSelect = document.getElementById("modelSelect");
    currentModel = modelSelect.value;
    
    try {
        await fetch('/api/switch_provider', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ provider: currentProvider, model: currentModel })
        });
        
        checkHealth();
    } catch (error) {
        console.error("Error switching model:", error);
    }
}

// Send Message
async function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text) return;
    
    addMessage("user", text);
    input.value = "";
    input.style.height = 'auto';
    
    document.getElementById("status").textContent = "Thinking...";
    
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: text,
                session_id: sessionId,
                provider: currentProvider,
                model: currentModel
            })
        });
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantMessage = "";
        
        const messageDiv = document.createElement("div");
        messageDiv.className = "message assistant";
        messageDiv.innerText = "";
        document.getElementById("chatArea").appendChild(messageDiv);
        
        // Remove empty state if exists
        const emptyState = document.querySelector('.empty-state');
        if (emptyState) emptyState.remove();
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            const chunk = decoder.decode(value);
            assistantMessage += chunk;
            messageDiv.innerText = assistantMessage;
            
            const chatArea = document.getElementById("chatArea");
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        checkHealth();
    } catch (error) {
        console.error("Error:", error);
        addMessage("assistant", "Error: Could not connect to server. Please check your settings.");
    }
}

// Add Message
function addMessage(role, text) {
    const chatArea = document.getElementById("chatArea");
    
    // Remove empty state if exists
    const emptyState = document.querySelector('.empty-state');
    if (emptyState) emptyState.remove();
    
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${role}`;
    messageDiv.innerText = text;
    chatArea.appendChild(messageDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
}

// Handle Key Down
function handleKeyDown(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

// Voice Input
function toggleVoice() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Voice input is not supported in your browser. Please use Chrome or Edge.');
        return;
    }
    
    const voiceBtn = document.getElementById('voiceBtn');
    
    if (isRecording) {
        stopRecording();
    } else {
        startRecording();
    }
}

function startRecording() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('voiceBtn').classList.add('recording');
    };
    
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('messageInput').value = transcript;
    };
    
    recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        stopRecording();
    };
    
    recognition.onend = () => {
        stopRecording();
    };
    
    recognition.start();
}

function stopRecording() {
    if (recognition) {
        recognition.stop();
    }
    isRecording = false;
    document.getElementById('voiceBtn').classList.remove('recording');
}

// Settings
function showSettings() {
    document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
    document.getElementById('settingsModal').classList.remove('active');
}

function loadSettings() {
    const settings = JSON.parse(localStorage.getItem('jarvis_settings') || '{}');
    document.getElementById('openaiKey').value = settings.openaiKey || '';
    document.getElementById('anthropicKey').value = settings.anthropicKey || '';
    document.getElementById('huggingfaceKey').value = settings.huggingfaceKey || '';
    document.getElementById('customKey').value = settings.customKey || '';
    document.getElementById('customEndpoint').value = settings.customEndpoint || '';
    document.getElementById('customModel').value = settings.customModel || '';
    document.getElementById('temperature').value = settings.temperature || '';
    document.getElementById('maxTokens').value = settings.maxTokens || '';
}

async function saveSettings() {
    const settings = {
        openai_key: document.getElementById('openaiKey').value,
        anthropic_key: document.getElementById('anthropicKey').value,
        huggingface_key: document.getElementById('huggingfaceKey').value,
        custom_key: document.getElementById('customKey').value,
        custom_endpoint: document.getElementById('customEndpoint').value,
        custom_model: document.getElementById('customModel').value,
        temperature: parseFloat(document.getElementById('temperature').value) || null,
        max_tokens: parseInt(document.getElementById('maxTokens').value) || null
    };
    
    try {
        const response = await fetch('/api/settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(settings)
        });
        
        const result = await response.json();
        
        if (result.success) {
            localStorage.setItem('jarvis_settings', JSON.stringify(settings));
            closeSettings();
            alert('Settings saved successfully! Providers have been updated.');
            loadProviders();
            checkHealth();
        } else {
            alert('Error saving settings: ' + result.error);
        }
    } catch (error) {
        console.error('Error saving settings:', error);
        alert('Error saving settings. Please try again.');
    }
}

// Memory
async function showMemory() {
    try {
        const response = await fetch('/api/memory');
        const data = await response.json();
        
        let memoryText = "JARVIS Memory:\n\n";
        if (data.learned && data.learned.length > 0) {
            data.learned.forEach(item => {
                memoryText += `[${item.category.toUpperCase()}] ${item.content}\n`;
            });
        } else {
            memoryText += "No learned information yet.";
        }
        
        alert(memoryText);
    } catch (error) {
        alert("Could not fetch memory data.");
    }
}

// New Chat
function newChat() {
    sessionId = generateSessionId();
    document.getElementById('chatArea').innerHTML = `
        <div class="empty-state">
            <div class="empty-state-icon">🚀</div>
            <div class="empty-state-text">Welcome to JARVIS</div>
            <div class="empty-state-subtext">Select a model and start chatting</div>
        </div>
    `;
}

// Show Chat
function showChat() {
    // Already on chat view
}
</script>

</body>
</html>
