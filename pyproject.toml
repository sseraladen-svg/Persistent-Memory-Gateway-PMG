[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-memory-gateway"
version = "0.2.0"
description = "A small, model-agnostic memory layer for AI tools: MCP server, OpenAI-compatible proxy and local dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "sseraladen-svg" }]
keywords = ["ai", "llm", "memory", "mcp", "openai", "proxy", "tokens"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
pmg = "pmg.cli:main"

[project.urls]
Homepage = "https://github.com/sseraladen-svg/Persistent-Memory-Gateway-PMG"
Issues = "https://github.com/sseraladen-svg/Persistent-Memory-Gateway-PMG/issues"

[tool.setuptools]
packages = ["pmg"]

[tool.setuptools.package-data]
pmg = ["rules.default.json", "web/*.html"]
